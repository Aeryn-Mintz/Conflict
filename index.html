<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conflict</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-base, #040806);
            background-image:
                radial-gradient(circle at 50% 18%, rgba(16, 185, 129, 0.18), transparent 55%),
                radial-gradient(circle at 15% 85%, rgba(251, 191, 36, 0.06), transparent 45%),
                radial-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px;
            color: var(--text-main, #ecfdf5);
            margin: 0;
            height: 100vh;
            user-select: none;
        }
        .launcher-box {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 34px 32px;
            background: linear-gradient(160deg, rgba(12, 24, 16, 0.94), rgba(5, 10, 7, 0.98));
            border: 1px solid rgba(16, 185, 129, 0.28);
            border-radius: 18px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .launcher-box::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-main, #10b981), #fbbf24, var(--accent-main, #10b981), transparent);
            opacity: 0.75;
            pointer-events: none;
        }
        .brand-huge {
            font-family: 'Cinzel', 'Nunito', serif;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #fff;
            text-shadow: 0 4px 20px rgba(16, 185, 129, 0.45);
        }
        .brand-icon-img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.85));
        }
        .choice-btn {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            font-weight: 800;
            letter-spacing: 0.3px;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .primary-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #031109;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .primary-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5);
        }
        .secondary-btn {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        .secondary-btn:hover {
            background: rgba(16, 185, 129, 0.14);
            border-color: rgba(16, 185, 129, 0.45);
            transform: translateY(-1px);
        }
        .outline-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            border: 1px dashed rgba(255, 255, 255, 0.22);
        }
        .outline-btn:hover {
            border-style: solid;
            border-color: #fff;
            color: #fff;
        }
        .hidden-panel {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        input {
            padding: 11px 14px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
            background: rgba(0, 0, 0, 0.75);
        }
        .room-radar-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            background: linear-gradient(135deg, rgba(16, 28, 20, 0.75), rgba(6, 12, 8, 0.9));
            border: 1px solid rgba(16, 185, 129, 0.22);
            border-left: 3px solid var(--accent-main, #10b981);
            border-radius: 10px;
            text-align: left;
            transition: all 0.18s ease;
        }
        .room-radar-card:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        }
        .net-badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
        }
        #launcher-toast {
            display: none;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="index-lang-flags" style="position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100;">
        <img src="https://flagcdn.com/w40/gb.png" alt="English" id="flag-en" class="lang-flag" style="width: 32px; height: 24px; cursor: pointer; border-radius: 4px; border: 2px solid transparent; transition: all 0.2s ease; object-fit: cover;">
        <img src="https://flagcdn.com/w40/br.png" alt="Português" id="flag-pt-br" class="lang-flag" style="width: 32px; height: 24px; cursor: pointer; border-radius: 4px; border: 2px solid transparent; transition: all 0.2s ease; object-fit: cover;">
    </div>

    <div id="update-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 6, 0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <div style="width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <span id="update-msg" style="color: #10b981; margin-top: 15px; font-weight: bold;">Checking for updates...</span>
        <div style="width: 300px; height: 8px; background: rgba(255,255,255,0.1); margin-top: 15px; border-radius: 4px; overflow: hidden;">
            <div id="update-progress-bar" style="width: 0%; height: 100%; background: #10b981; transition: width 0.2s ease;"></div>
        </div>
    </div>

    <div class="launcher-box">
        <div class="brand-huge"><img src="./conflict-logo.png" alt="Logo" class="brand-icon-img"> Conflict</div>

        <!-- NON-BLOCKING TOAST MESSAGE (Replaces native alert() so Electron never locks input focus!) -->
        <div id="launcher-toast"></div>

        <!-- BACKGROUND LAN STATUS BAR -->
        <div id="bg-lan-status-bar" style="display:none; background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; justify-content: space-between; align-items: center; font-size: 12px;">
            <div id="bg-lan-status-text" style="text-align: left; color: #ecfdf5;"></div>
            <div style="display: flex; gap: 6px;">
                <button id="btn-open-active-room" class="primary-btn" style="padding: 5px 10px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">Open Room</button>
                <button id="btn-disconnect-bg-lan" class="outline-btn" style="padding: 5px 8px; font-size: 11px; border-radius: 6px; cursor: pointer; color: #ef4444; border-color: rgba(239,68,68,0.5);">Disconnect</button>
            </div>
        </div>

        <div id="main-choices">
            <div style="text-align: left; margin-bottom: 16px;">
                <div style="font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: flex; justify-content: space-between;">
                    <span id="saved-networks-title">🌐 My Saved Networks</span>
                </div>
                <div id="saved-networks-list" class="kokonut-scroll" style="display: flex; flex-direction: column; gap: 8px; max-height: 185px; overflow-y: auto; padding-right: 2px;"></div>
            </div>

            <div style="background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.22);">
                <input type="text" id="new-net-name-input" placeholder="Network Name (e.g. Squad 1-2-3, RPG Table)..." style="width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 13px;">
                <div style="display: flex; gap: 10px;">
                    <button id="host-game-btn" type="button" class="primary-btn choice-btn" style="margin-bottom: 0; flex: 1;">➕ Create Network</button>
                    <button id="join-game-btn" type="button" class="secondary-btn choice-btn" style="margin-bottom: 0; flex: 1;">🔗 Join Network</button>
                </div>
            </div>
        </div>

        <!-- JOIN NETWORK PANEL -->
        <div id="join-panel" class="hidden-panel">
            <h3 id="join-net-heading" style="margin-top: 0; margin-bottom: 14px;">Join a Network</h3>
            
            <div style="background: rgba(0,0,0,0.35); padding: 14px; border-radius: 10px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); text-align: left;">
                <p id="opt1-code-label" style="color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 0; margin-bottom: 8px;">Option 1: Enter Network Name & Code</p>
                <input type="text" id="join-net-name-input" placeholder="Exact Network Name (or paste Invite)..." style="width: 100%; box-sizing: border-box; margin-bottom: 8px; font-size: 12px;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="invite-input" placeholder="6-Letter Network Code..." style="flex-grow: 1; box-sizing: border-box; text-align: center; font-size: 13px; text-transform: uppercase; font-weight: bold;">
                    <button id="btn-connect-join" type="button" class="primary-btn choice-btn" style="width: auto; margin-bottom: 0; padding: 10px 20px;">Save & Join</button>
                </div>
            </div>

            <div id="radar-container" style="background: rgba(0,0,0,0.35); padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
                <p style="color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 0; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span id="opt2-radar-label">Option 2: Active Networks on Radar</span>
                    <span id="radar-spinner" style="display:none; color: #10b981;">Scanning...</span>
                </p>
                <div id="radar-results" class="kokonut-scroll" style="display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto;"></div>
                <button id="scan-rooms-btn" type="button" class="secondary-btn choice-btn" style="margin-bottom: 0; margin-top: 10px; font-size: 13px; padding: 9px;">📡 Scan for Networks</button>
            </div>

            <button id="btn-back-join" type="button" class="outline-btn choice-btn" style="margin-top: 14px; margin-bottom: 0;">Back</button>
        </div>
    </div>

    <script src="js/no_changes/updater.js"></script>
    <script src="js/no_changes/sfx.js"></script>
    <script>
        const savedBg = localStorage.getItem('themeBg');
        const savedPanel = localStorage.getItem('themePanel');
        const savedText = localStorage.getItem('themeText');
        const savedAccent = localStorage.getItem('themeAccent');

        if (savedBg) document.documentElement.style.setProperty('--bg-base', savedBg);
        if (savedText) document.documentElement.style.setProperty('--text-main', savedText);
        if (savedAccent) document.documentElement.style.setProperty('--accent-main', savedAccent);
        if (savedPanel) {
            let pr = parseInt(savedPanel.slice(1, 3), 16), pg = parseInt(savedPanel.slice(3, 5), 16), pb = parseInt(savedPanel.slice(5, 7), 16);
            document.documentElement.style.setProperty('--panel-bg', `rgba(${pr || 10}, ${pg || 20}, ${pb || 12}, 0.92)`);
        }

        let ipcRenderer = null;
        try { if (typeof require !== 'undefined') ipcRenderer = require('electron').ipcRenderer; } catch (e) {}

        const myPersistentUid = localStorage.getItem('conflictPersistentUid') || Math.random().toString(36).substring(2, 15);
        localStorage.setItem('conflictPersistentUid', myPersistentUid);

        let currentActiveRoomCode = null;
        let currentVirtualIp = '10.66.0.x';
        let toastTimer = null;

        function showToast(msg, inputToFocus = null) {
            const toast = document.getElementById('launcher-toast');
            if (toast) {
                toast.innerText = msg;
                toast.style.display = 'block';
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3200);
            }
            if (inputToFocus) {
                inputToFocus.style.borderColor = '#ef4444';
                inputToFocus.focus();
                setTimeout(() => { inputToFocus.style.borderColor = ''; }, 2000);
            }
        }

        function getCurTranslations() {
            const lang = localStorage.getItem('conflictLang') || 'en';
            return (window.conflictTranslations && window.conflictTranslations[lang]) || window.conflictTranslations?.['en'] || {};
        }

        function cleanNetPair(code, name) {
            let cleanName = String(name || '').trim();
            let cleanCode = String(code || '').trim().toUpperCase();
            if (cleanName.includes('|')) {
                const parts = cleanName.split('|');
                cleanName = parts[0].trim();
                if (!cleanCode && parts[1]) cleanCode = parts[1].trim().toUpperCase();
            }
            if (cleanCode.includes('|')) {
                const parts = cleanCode.split('|');
                cleanCode = parts[parts.length - 1].trim().toUpperCase();
                if (!cleanName && parts[0]) cleanName = parts[0].trim();
            }
            if (!cleanName) cleanName = `Network #${cleanCode}`;
            return { code: cleanCode, name: cleanName };
        }

        function getSavedNetworks() {
            try {
                const raw = JSON.parse(localStorage.getItem('conflict_networks') || '[]');
                let repaired = false;
                const cleaned = raw.map(n => {
                    const pair = cleanNetPair(n.code, n.name);
                    if (pair.name !== n.name || pair.code !== n.code) repaired = true;
                    return { ...n, code: pair.code, name: pair.name };
                });
                if (repaired) localStorage.setItem('conflict_networks', JSON.stringify(cleaned));
                return cleaned;
            } catch (e) { return []; }
        }

        function saveNetworkToStorage(code, name) {
            const { code: cleanCode, name: finalName } = cleanNetPair(code, name);
            let list = getSavedNetworks();
            const existing = list.find(n => n.code === cleanCode);

            if (existing) {
                existing.name = finalName;
                existing.lastUsed = Date.now();
            } else {
                list.unshift({ code: cleanCode, name: finalName, lastUsed: Date.now() });
            }
            localStorage.setItem('conflict_networks', JSON.stringify(list));
            localStorage.setItem('conflictActiveNetwork', JSON.stringify({ code: cleanCode, name: finalName }));
        }

        function deleteNetworkFromStorage(code, name) {
            let list = getSavedNetworks().filter(n => n.code !== code);
            localStorage.setItem('conflict_networks', JSON.stringify(list));
            if (currentActiveRoomCode === code && ipcRenderer) {
                ipcRenderer.send('leave-virtual-lan');
                localStorage.removeItem('conflictActiveNetwork');
                currentActiveRoomCode = null;
            }
            window.renderSavedNetworks();
        }

        function connectToNetwork(code, name, openRoomAfter = true) {
            const { code: cleanCode, name: cleanName } = cleanNetPair(code, name);
            if (!cleanCode) return;

            saveNetworkToStorage(cleanCode, cleanName);
            localStorage.setItem('conflictServerUrl', 'ws://localhost:8080');
            currentActiveRoomCode = cleanCode;

            if (ipcRenderer) {
                const userName = localStorage.getItem('appUsername') || 'Player';
                ipcRenderer.send('connect-network', {
                    roomCode: cleanCode,
                    roomName: cleanName,
                    hostName: userName,
                    userId: myPersistentUid
                });
            }

            if (openRoomAfter) {
                window.location.assign('app.html');
            } else {
                window.renderSavedNetworks();
            }
        }

        window.renderSavedNetworks = function() {
            const cont = document.getElementById('saved-networks-list');
            const statusBar = document.getElementById('bg-lan-status-bar');
            const statusText = document.getElementById('bg-lan-status-text');
            if (!cont) return;

            const list = getSavedNetworks();
            const t = getCurTranslations();
            const savedActive = JSON.parse(localStorage.getItem('conflictActiveNetwork') || 'null');
            cont.innerHTML = '';

            if (statusBar && statusText) {
                if (currentActiveRoomCode) {
                    const netTitle = (savedActive && savedActive.code === currentActiveRoomCode) ? savedActive.name : `#${currentActiveRoomCode}`;
                    statusBar.style.display = 'flex';
                    statusText.innerHTML = `🟢 <strong>${netTitle}</strong> (<span style="font-family:monospace;">${currentActiveRoomCode}</span>) — LAN: <span style="font-family:monospace; color:#10b981;">${currentVirtualIp}</span>`;
                } else {
                    statusBar.style.display = 'none';
                }
            }

            if (list.length === 0) {
                cont.innerHTML = `<div style="padding: 16px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.15); color: rgba(255,255,255,0.45); font-size: 12px; text-align: center;">🎲 ${t.noSavedNetworks || 'No saved networks yet. Create or join a party network below!'}</div>`;
                return;
            }

            list.forEach(net => {
                const isConnected = currentActiveRoomCode === net.code;
                const card = document.createElement('div');
                card.className = 'room-radar-card';
                if (isConnected) card.style.borderColor = '#10b981';

                card.innerHTML = `
                    <div class="net-info-area" style="overflow:hidden; flex-grow:1; margin-right:8px;">
                        <div class="net-title-text" style="font-weight:800; font-size:14px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                            ${isConnected ? '🟢' : '🛡️'} ${net.name}
                        </div>
                        <div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px;">
                            Code: <span class="net-badge">${net.code}</span>
                            ${isConnected ? `<span style="color:#10b981; margin-left:6px; font-weight:bold;">• LAN Active</span>` : ''}
                        </div>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
                        ${!isConnected ? `<button type="button" class="secondary-btn btn-lan-only" data-code="${net.code}" data-name="${net.name}" title="Activate LAN in background without opening room" style="padding:6px 9px; font-size:11px; border-radius:7px; cursor:pointer;">🎮 LAN</button>` : ''}
                        <button type="button" class="primary-btn btn-conn" data-code="${net.code}" data-name="${net.name}" style="padding:6px 13px; font-size:12px; border-radius:7px; border:none; cursor:pointer; font-weight:800;">${isConnected ? 'Open Room' : (t.connectBtn || 'Connect')}</button>
                        <button type="button" class="outline-btn btn-del" data-code="${net.code}" data-name="${net.name}" title="Remove" style="padding:5px 8px; font-size:11px; border-radius:7px; cursor:pointer; color:#ef4444; border-color:rgba(239,68,68,0.4);">✕</button>
                    </div>
                `;
                cont.appendChild(card);
            });
        };

        // Render saved networks IMMEDIATELY on script load (never wait for async IPC!)
        window.renderSavedNetworks();

        function triggerRoomScan() {
            if (!ipcRenderer) return;
            const t = getCurTranslations();
            const radarSpinner = document.getElementById('radar-spinner');
            const scanBtn = document.getElementById('scan-rooms-btn');
            const radarResults = document.getElementById('radar-results');
            if (radarSpinner) radarSpinner.style.display = 'inline';
            if (scanBtn) scanBtn.disabled = true;
            if (radarResults) radarResults.innerHTML = `<span style="color: rgba(255,255,255,0.5); font-size: 12px;">${t.radarScanning || 'Searching for active networks...'}</span>`;
            ipcRenderer.send('scan-rooms');
        }

        if (ipcRenderer) {
            ipcRenderer.invoke('get-network-status').then((status) => {
                if (status && status.virtualIp) currentVirtualIp = status.virtualIp;
                if (status && status.activeRoomCode) {
                    currentActiveRoomCode = status.activeRoomCode;
                }
                window.renderSavedNetworks();
            }).catch(() => {});

            ipcRenderer.on('network-disconnected', () => {
                currentActiveRoomCode = null;
                localStorage.removeItem('conflictActiveNetwork');
                window.renderSavedNetworks();
            });

            ipcRenderer.on('scan-rooms-result', (event, rooms) => {
                const t = getCurTranslations();
                const radarSpinner = document.getElementById('radar-spinner');
                const scanBtn = document.getElementById('scan-rooms-btn');
                const radarResults = document.getElementById('radar-results');
                if (radarSpinner) radarSpinner.style.display = 'none';
                if (scanBtn) scanBtn.disabled = false;
                if (!radarResults) return;
                radarResults.innerHTML = '';

                if (!rooms || rooms.length === 0) {
                    radarResults.innerHTML = `<span style="color: rgba(255,255,255,0.4); font-size: 12px;">${t.noRadarRooms || 'No active networks found on radar right now.'}</span>`;
                    return;
                }

                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'room-radar-card';
                    card.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
                            <img src="${room.avatar || './Banaya.png'}" style="width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid #10b981; flex-shrink:0;">
                            <div style="overflow:hidden;">
                                <div style="font-weight:bold; font-size:13px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${room.roomName}</div>
                                <div style="font-size:11px; color:rgba(255,255,255,0.6);">Online: ${room.hostName} • <strong style="color:#10b981;">${room.roomCode}</strong></div>
                            </div>
                        </div>
                        <button type="button" class="primary-btn btn-radar-join" data-code="${room.roomCode}" data-name="${room.roomName}" style="padding:6px 12px; font-size:12px; border-radius:6px; border:none; cursor:pointer; font-weight:bold; flex-shrink:0;">${t.connectBtn || 'Connect'}</button>
                    `;
                    radarResults.appendChild(card);
                });
            });
        }

        // UNIFIED EVENT DELEGATION: Guarantees buttons ALWAYS respond on first click even if DOM re-renders!
        document.addEventListener('click', (e) => {
            const connBtn = e.target.closest('.btn-conn');
            if (connBtn) {
                connectToNetwork(connBtn.getAttribute('data-code'), connBtn.getAttribute('data-name'), true);
                return;
            }

            const lanOnlyBtn = e.target.closest('.btn-lan-only');
            if (lanOnlyBtn) {
                connectToNetwork(lanOnlyBtn.getAttribute('data-code'), lanOnlyBtn.getAttribute('data-name'), false);
                return;
            }

            const delBtn = e.target.closest('.btn-del');
            if (delBtn) {
                deleteNetworkFromStorage(delBtn.getAttribute('data-code'), delBtn.getAttribute('data-name'));
                return;
            }

            const radarJoinBtn = e.target.closest('.btn-radar-join');
            if (radarJoinBtn) {
                connectToNetwork(radarJoinBtn.getAttribute('data-code'), radarJoinBtn.getAttribute('data-name'), true);
                return;
            }

            if (e.target.closest('#btn-open-active-room')) {
                window.location.assign('app.html');
                return;
            }

            if (e.target.closest('#btn-disconnect-bg-lan')) {
                if (ipcRenderer) ipcRenderer.send('leave-virtual-lan');
                localStorage.removeItem('conflictActiveNetwork');
                currentActiveRoomCode = null;
                window.renderSavedNetworks();
                return;
            }

            if (e.target.closest('#host-game-btn')) {
                const nameInp = document.getElementById('new-net-name-input');
                const rawName = nameInp?.value.trim();
                if (!rawName) {
                    const defaultName = `${localStorage.getItem('appUsername') || 'Party'}'s Network`;
                    const newCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                    connectToNetwork(newCode, defaultName, true);
                    return;
                }
                const newCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                connectToNetwork(newCode, rawName, true);
                return;
            }

            if (e.target.closest('#join-game-btn')) {
                const mainName = document.getElementById('new-net-name-input')?.value.trim();
                if (mainName) {
                    const joinNameInp = document.getElementById('join-net-name-input');
                    const codeInp = document.getElementById('invite-input');
                    if (mainName.includes('|')) {
                        const parts = mainName.split('|');
                        if (joinNameInp) joinNameInp.value = parts[0].trim();
                        if (codeInp && parts[1]) codeInp.value = parts[1].trim().toUpperCase();
                    } else if (joinNameInp && !joinNameInp.value) {
                        joinNameInp.value = mainName;
                    }
                }
                document.getElementById('main-choices').style.display = 'none';
                document.getElementById('join-panel').style.display = 'block';
                triggerRoomScan();
                return;
            }

            if (e.target.closest('#btn-back-join')) {
                document.getElementById('join-panel').style.display = 'none';
                document.getElementById('main-choices').style.display = 'block';
                return;
            }

            if (e.target.closest('#scan-rooms-btn')) {
                triggerRoomScan();
                return;
            }

            if (e.target.closest('#btn-connect-join')) {
                const nameInp = document.getElementById('join-net-name-input');
                const codeInp = document.getElementById('invite-input');
                const exactName = nameInp?.value.trim();
                const code = codeInp?.value.trim().toUpperCase();

                if (!code || code.length < 3) {
                    showToast("Please enter a valid 6-letter Network Code!", codeInp);
                    return;
                }
                connectToNetwork(code, exactName || `Network #${code}`, true);
                return;
            }
        });

        document.getElementById('join-net-name-input')?.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.includes('|')) {
                const parts = val.split('|');
                e.target.value = parts[0].trim();
                const codeInp = document.getElementById('invite-input');
                if (codeInp && parts[1]) codeInp.value = parts[1].trim().toUpperCase();
            }
        });

        document.getElementById('invite-input')?.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.includes('|')) {
                const parts = val.split('|');
                const nameInp = document.getElementById('join-net-name-input');
                if (nameInp && parts[0]) nameInp.value = parts[0].trim();
                if (parts[1]) e.target.value = parts[1].trim().toUpperCase();
            }
        });

        document.getElementById('new-net-name-input')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('host-game-btn')?.click();
        });
    </script>
    <script src="js/lang.js"></script>
</body>
</html>
